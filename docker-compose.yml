services:
  app:
    platform: linux/amd64
    image: aakarshkumar25/prism-live-rag:judge
    build: .
    ports:
      - "127.0.0.1:${PRISM_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PYTEST_ADDOPTS: "-o cache_dir=/app/.cache/pytest"
      EMBEDDING_DEVICE: cpu
      EMBEDDING_CACHE_DIR: /opt/prism-assets/current/fastembed
      EMBEDDING_LOCAL_FILES_ONLY: "true"
      HF_HOME: /opt/prism-assets/current/huggingface
    volumes:
      - telemetry:/app/.cache/telemetry
      - assets:/opt/prism-assets
    command: ["prism-rag", "serve", "--host", "0.0.0.0", "--port", "8080"]
volumes:
  telemetry:
  assets:
