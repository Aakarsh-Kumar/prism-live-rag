[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-live-rag"
version = "0.1.0"
description = "Streaming Live RAG engine for Samsung Theme 04"
requires-python = ">=3.11,<3.14"
dependencies = [
  "lancedb>=0.13.0",
  "pyarrow>=15.0.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
neural = [
  "fastembed==0.8.0",
  "onnxruntime==1.24.2",
]
# GPU build. onnxruntime and onnxruntime-gpu ship the same module, so install
# one or the other, never both. The [cuda,cudnn] extras are required for CUDA
# 12 support (the bare wheel bundles no NVIDIA libraries). Prefer
# `scripts/setup_embeddings.sh`, which detects the GPU and swaps the CPU wheel
# out cleanly; this extra installs ~1 GB of CUDA/cuDNN wheels.
neural-gpu = [
  "fastembed==0.8.0",
  "onnxruntime-gpu[cuda,cudnn]==1.24.4",
]

[project.scripts]
prism-rag = "prism_live_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
